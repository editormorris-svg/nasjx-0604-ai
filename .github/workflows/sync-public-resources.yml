name: Sync NASJX public resources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-public-resources.yml'
      - 'PUBLIC_RESOURCE_REPOSITORY.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Download approved public resource folder
        run: |
          rm -rf resources-sync
          mkdir -p resources-sync
          gdown --folder 'https://drive.google.com/drive/folders/17W7nGnR402NGSEDgNmH75ELEeG1pn-wX' -O resources-sync
          find resources-sync -type f -print | sort

      - name: Build clean public resource tree
        run: |
          rm -rf resources
          mkdir -p resources
          cp -a resources-sync/. resources/
          find resources -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Commit synced release files
        run: |
          git config user.name 'nasjx-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add resources SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No public resource changes to commit.'
            exit 0
          fi
          git commit -m 'Sync approved NASJX public resources'
          git push
